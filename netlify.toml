[build]
  command = "npm run build"
  publish = "dist/ruleta-gratitud/browser"

[build.environment]
  NODE_VERSION = "22.23.2"
  NPM_VERSION = "10.9.8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
